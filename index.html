  <!-- add & edit sections here -->
  </div>
  <div id="about" class="section">
    <p>Pinche Perro is an art and design collective.</p>
  </div>
  <div id="contact" class="section" style="display:none">
    <p><a href="mailto:admin@pincheperro.art">admin@pincheperro.art</a></p>

    <p>Coming soon.</p>
  </div>
  <div id="events" class="section" style="display:none">

  </div>
</div>

<!-- section selection -->
  <script>
    function showSection(id, link) {
      document.querySelectorAll('.nav-btn').forEach(a => a.classList.remove('active'));
      document.querySelectorAll('#about, #contact, #gallery, #events').forEach(el => el.style.display = 'none');
      document.getElementById(id).style.display = 'block';
      link.classList.add('active');
    }
  </script>
