<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pinche Perro</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Garamond, serif;
      text-align: center;
      padding: 60px 10px;
      background: #ffffff;
      color: #000000;
    }

    .site-logo {
      max-width: 300px;
      width: 100%;
      margin-top: 10px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      letter-spacing: 8px;
    }

    p {
      font-size: 1rem;
      margin-top: 5px;
	opacity: 50%;
    }

    a {
      color: #222;
      text-decoration: none;
      border-bottom: 1px solid #222;
      padding-bottom: 2px;
    }

    a:hover {
      color: #555;
      border-bottom-color: #555;
    }

    /* Gallery */
    .gallery-wrap {
      max-width: 960px;
      margin: 30px auto 0;
    }

    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      background: none;
      border: 1px solid #f83d84;
      border-radius: 20px;
      padding: 5px 18px;
      font-family: Garamond, serif;
      font-size: 1rem;
      cursor: pointer;
      color: #f83d84;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #faa55a;
      color: #fff;
      border-color: #faa55a;
    }

    .masonry {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      column-gap: 12px;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 12px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      aspect-ratio: 3 / 4;
    }

    .masonry-item img {
      width: 100%;
      display: block;
      object-fit: cover;
      max-width: 100%;
      margin: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      filter: grayscale(20%);
    }

    .masonry-item:hover img {
      filter: grayscale(60%);
      opacity: 0.9;
    }

    .masonry-item.hidden {
  display: none;
}

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      display: block;
      margin: 0;
      max-width: 90vw;
    }

    .lb-caption {
      color: #ffffff;
      font-family: Garamond, serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .lb-close {
      position: absolute;
      top: 20px;
      right: 26px;
      background: none;
      border: none;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      font-family: Garamond, serif;
      line-height: 1;
    }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      border: none;
      color: #f83d84;
      font-size: 28px;
      cursor: pointer;
      padding: 10px 16px;
      transition: background 0.2s;
      font-family: Garamond, serif;
    }

    .lb-nav:hover { background: rgba(255,255,255,0.25); }
    .lb-prev { left: 16px; }
    .lb-next { right: 16px; }

    .contact-line {
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <img class="site-logo" src="Logo.png" alt="Pinche Perro Logo">

<p class="contact-line">
  <p>SANTA TERESA 21</p>
  <p>COLONIA ALLENDE</p>
  <p>ADMIN@PINCHEPERRO.ART</p>
</p>
  
    </div>
  
  <!-- Gallery -->
  <div class="gallery-wrap">

    <div class="filter-bar" id="filters"></div>

    <div class="masonry" id="gallery"></div>


  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLB()">&#215;</button>
    <button class="lb-nav lb-prev" onclick="navLB(-1)">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <p class="lb-caption" id="lb-cap"></p>
    <button class="lb-nav lb-next" onclick="navLB(1)">&#8250;</button>
  </div>

  <script>
    /* ── Replace these with your real images ── */
    const images = [
      { src: "images/jewelry1.jpg", caption: "Mexican fire opal silver cuff.", cat: "metal" },
      { src: "images/jewelry2.jpg", caption: "Whale shark bolo. Hand-carved, cast in silver.", cat: "metal" },
      { src: "images/bone1.jpg", caption: "Hand-carved white-tailed deer antler ring.", cat: "bone" },
      { src: "images/jewelry3.jpg", caption: "Hand-made silver jewelry.", cat: "metal" },
    ];
    /* ─────────────────────────────────────── */

    let current = 0;
    let activeFilter = "all";

    const cats = ["all", ...new Set(images.map(i => i.cat))];
    const filterBar = document.getElementById("filters");

    cats.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (c === "all" ? " active" : "");
      btn.textContent = c.charAt(0).toUpperCase() + c.slice(1);
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = c;
        applyFilter();
      };
      filterBar.appendChild(btn);
    });

    const gallery = document.getElementById("gallery");
    images.forEach((img, i) => {
      const item = document.createElement("div");
      item.className = "masonry-item";
      item.dataset.cat = img.cat;
      item.dataset.idx = i;
      item.innerHTML = `<img src="${img.src}" alt="" loading="lazy">`;
      item.onclick = () => openLB(i);
      gallery.appendChild(item);
    });

    function applyFilter() {
      document.querySelectorAll(".masonry-item").forEach(el => {
        el.classList.toggle("hidden", activeFilter !== "all" && el.dataset.cat !== activeFilter);
      });
    }

    function visibleImages() {
      return images.filter((_, i) => {
        const el = gallery.querySelector(`[data-idx="${i}"]`);
        return el && !el.classList.contains("hidden");
      });
    }

    function openLB(globalIdx) {
      const vis = visibleImages();
      current = vis.indexOf(images[globalIdx]);
      if (current < 0) current = 0;
      showLB(current, vis);
    }

    function showLB(idx, vis) {
      vis = vis || visibleImages();
      current = idx;
      document.getElementById("lb-img").src = vis[idx].src;
      document.getElementById("lb-cap").textContent = vis[idx].caption;
      document.getElementById("lightbox").classList.add("active");
    }

    function navLB(dir) {
      const vis = visibleImages();
      current = (current + dir + vis.length) % vis.length;
      showLB(current, vis);
    }

    function closeLB() {
      document.getElementById("lightbox").classList.remove("active");
    }

    document.getElementById("lightbox").addEventListener("click", function (e) {
      if (e.target === this) closeLB();
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeLB();
      if (e.key === "ArrowRight") navLB(1);
      if (e.key === "ArrowLeft") navLB(-1);
    });
  </script>

</body>
</html>
